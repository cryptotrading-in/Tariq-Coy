border-radius:20px;padding:4px 8px;background:#e5f4ec;color:#176b57;font-size:11px;font-weight:bold}.out{background:#fff0dc;color:#9a5700}.unset{background:#feeceb;color:#b42318}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px}.formgrid label,.login label{display:grid;gap:6px;font-size:12px}.formgrid input,.formgrid select,.login input{width:100%;padding:10px;border:1px solid #d4dfeb;border-radius:8px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login form{width:min(400px,100%);background:white;padding:28px;border:1px solid #dfe7ef;border-radius:14px}.modalback{position:fixed;inset:0;background:#102a4388;display:grid;place-items:center;padding:16px;z-index:1000}.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 20px 60px #102a4340}.modal h2{font-size:19px;margin-bottom:6px}.modal .fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.modal label{display:grid;gap:6px;font-size:12px}.modal input,.modal select{width:100%;padding:10px;border:1px solid #d4dfeb;border-radius:8px}.amountline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f5}.amountline.total{font-size:18px;font-weight:700;border-bottom:0}.name-link{border:0;background:none;padding:0;color:#176b57;text-decoration:underline;font:inherit;font-weight:600;cursor:pointer}.status-unpaid{background:#fff0dc;color:#9a5700}.modalactions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}.login label{margin:14px 0}.empty{text-align:center;padding:35px;color:#718096}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{padding:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.content{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.formgrid{grid-template-columns:1f /* Compact in-app confirmations and feedback */
.toast-region{position:fixed;top:16px;right:16px;z-index:1200;display:grid;gap:8px;width:min(360px,calc(100vw - 32px));pointer-events:none}.toast{padding:12px 14px;border:1px solid #d4dfeb;border-left:4px solid #176b57;border-radius:10px;background:#fff;color:#183047;box-shadow:0 12px 32px #102a4326;font-size:13px;line-height:1.45;overflow-wrap:anywhere}.toast.error{border-left-color:#b42318}.toast.success{border-left-color:#176b57}.confirm-modal .modal{width:min(420px,100%);padding:22px}.confirm-modal .confirm-message{font-size:14px;line-height:1.55;margin:14px 0 8px}.confirm-modal .confirm-details{background:#f6f8fb;border:1px solid #e4ebf2;border-radius:9px;padding:11px 12px;margin-top:12px;line-height:1.6;font-size:13px;overflow-wrap:anywhere}.confirm-modal .btn.danger{background:#b42318;color:#fff;border-color:#b42318}.confirm-modal .btn:focus-visible{outline:3px solid #83c5b7;outline-offset:2px}
</style></head><body><div id="app">Loading…</div>
<script>
const $=s=>document.querySelector(s);let user=null,employees=[],page="Home",month=new Date().toISOString().slice(0,7);
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const RANK_ORDER=["DD","AD","INSP","SI","ASI","SGT","CPL"];
function rankSorted(list){const order=new Map(RANK_ORDER.map((r,i)=>[r,i]));return [...list].sort((a,b)=>{const d=(order.get(String(a.rank||"").toUpperCase())??999)-(order.get(String(b.rank||"").toUpperCase())??999);if(d)return d;const an=Number((String(a.force_no||"").match(/(\d+)$/)||[0,"0"])[1]),bn=Number((String(b.force_no||"").match(/(\d+)$/)||[0,"0"])[1]);return an-bn||String(a.force_no||"").localeCompare(String(b.force_no||""))})}
function ratesRankSorted(list){const order=new Map(RANK_ORDER.map((r,i)=>[r,i]));return [...list].sort((a,b)=>{const ar=String(a.rank||"").toUpperCase(),br=String(b.rank||"").toUpperCase();const d=(order.get(ar)??999)-(order.get(br)??999);if(d)return d;const livingOrder={IN:0,OUT:1};const ls=(livingOrder[String(a.living_status||"").toUpperCase()]??2)-(livingOrder[String(b.living_status||"").toUpperCase()]??2);if(ls)return ls;return String(a.effective_from||"").localeCompare(String(b.effective_from||""))})}

let toastRegion=null;
function notify(message,type="success"){
 if(!toastRegion||!toastRegion.isConnected){toastRegion=document.createElement("div");toastRegion.className="toast-region";toastRegion.setAttribute("aria-live","polite");toastRegion.setAttribute("aria-atomic","false");document.body.appendChild(toastRegion)}
 const item=document.createElement("div");item.className="toast "+(type==="error"?"error":"success");item.setAttribute("role",type==="error"?"alert":"status");item.textContent=String(message??"");toastRegion.appendChild(item);
 setTimeout(()=>{item.remove();if(toastRegion&&!toastRegion.children.length){toastRegion.remove();toastRegion=null}},4500);
}
function confirmAction({title="Please confirm",message="Are you sure?",details="",confirmLabel="Confirm",danger=false}={}){
 return new Promise(resolve=>{
  const host=document.createElement("div");host.className="modalback confirm-modal";host.setAttribute("role","presentation");
  host.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title">'+esc(title)+'</h2><p class="confirm-message">'+esc(message)+'</p>'+(details?'<div class="confirm-details">'+details+'</div>':'')+'<div class="modalactions"><button type="button" class="btn" data-confirm-cancel>Cancel</button><button type="button" class="btn '+(danger?'danger':'primary')+'" data-confirm-ok>'+esc(confirmLabel)+'</button></div></div>';
  const finish=value=>{host.remove();document.removeEventListener("keydown",onKey);resolve(value)};
  const onKey=e=>{if(e.key==="Escape")finish(false)};
  host.addEventListener("click",e=>{if(e.target===host)finish(false)});
  host.querySelector("[data-confirm-cancel]").onclick=()=>finish(false);
  host.querySelector("[data-confirm-ok]").onclick=()=>finish(true);
  document.addEventListener("keydown",onKey);document.body.appendChild(host);host.querySelector("[data-confirm-cancel]").focus();
 });
}
function money(v){return Math.round(Number(v)||0).toLocaleString("en-PK",{maximumFractionDigits:0})}
function fmtDate(v){if(!v)return "";let s=String(v).slice(0,10),m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+"-"+m[2]+"-"+m[1]:s}
function parseDateInput(v){if(!v)return "";let m=String(v).trim().match(/^(\d{2})-(\d{2})-(\d{4})$/);if(!m)return "";let iso=m[3]+"-"+m[2]+"-"+m[1],d=new Date(iso+"T00:00:00Z");return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===iso?iso:""}
function formatNowDate(){let d=new Date();return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear()}
function reportValue(k,v,i){let value=k==="sr_no"?(v??i+1):(v??"");if(/(^date$|_date$|^from_date$|^to_date$|^payment_date$)/.test(k))return fmtDate(value);if(["welfare","mod_amount","med","barber","waiter","wman","contribution_total","mess_amount","leave_deduction","total_due","mess_base"].includes(k))return money(value);return value}
async function api(path,opts={}){let r=await fetch("/api"+path,{credentials:"same-origin",...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function post(p,b){return api(p,{method:"POST",body:JSON.stringify(b)})}function pill(s){return '<span class="pill '+(s==="OUT"?"out":s==="UNSET"?"unset":"")+'">'+esc(s||"UNSET")+"</span>"}
function nav(){return ["Home","Employees","Collection","History","Reports","Contribution Rates","Settings"].map(x=>'<button class="'+(page===x?"active":"")+'" data-page="'+x+'">'+x+"</button>").join("")}
function layout(body){$("#app").innerHTML='<div class="shell"><aside class="side"><b>TARIQ COY</b><p class="muted">Personnel Management</p><nav class="nav">'+nav()+'</nav></aside><main class="main"><header class="top"><div><b>'+page+'</b><div class="muted">'+month+'</div></div><div>'+esc(user.username)+' <button id="logout" class="btn">Log out</button></div></header><section class="content">'+body+'</section></main></div>';document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$("#logout").onclick=logout}
function title(t,s,action=""){return '<div class="panelhead"><div><h1>'+t+'</h1><div class="muted">'+s+'</div></div>'+action+"</div>"}
function list(){return '<div class="panel"><div class="panelhead"><h2>Employee Register ('+employees.length+')</h2><button id="add" class="btn primary">+ Add employee</button></div><div class="tablewrap"><table><thead><tr><th>Sr. No.</th><th>Force No.</th><th>Rank</th><th>Name</th><th>Living</th></tr></thead><tbody>'+rankSorted(employees).map((e,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(e.force_no)+'</td><td>'+esc(e.rank)+'</td><td><button class="name-link" data-open="'+e.id+'" style="border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--primary,#2563eb);cursor:pointer;text-align:left">'+esc(e.name)+'</button></td><td>'+pill(e.living_status)+'</td></tr>').join("")+'</tbody></table></div></div>'}
function home(){let ins=employees.filter(e=>e.living_status==="IN").length,outs=employees.filter(e=>e.living_status==="OUT").length;return title("Personnel Overview","Approved master register")+'<div class="cards"><div class="card"><label>Total Employees</label><strong>'+employees.length+'</strong></div><div class="card"><label>IN Living</label><strong>'+ins+'</strong></div><div class="card"><label>OUT Living</label><strong>'+outs+'</strong></div><div class="card"><label>Unconfirmed</label><strong>'+(employees.length-ins-outs)+'</strong></div></div>'+list()}
const fields=[["force_no","Force No."],["rank","Rank"],["name","Name"],["father_name","Father Name"],["date_of_birth","Date of Birth"],["education","Education"],["religion","Religion"],["caste","Caste"],["joining_date","Joining Date"],["current_rank_date","Current Rank Date"],["fsd_joining_date","FSD Joining Date"],["blood_group","Blood Group"],["mobile_no","Mobile No."],["emergency_no","Emergency No."],["living_status","Living Status"],["marital_status","Marital Status"],["no_of_children","No. of Children"],["spouse_no","Spouse Contact"],["courses","Courses"],["present_address","Present Address"],["permanent_address","Permanent Address"],["domicile","Domicile"],["cnic","CNIC"],["tariq_coy_joining_date","Tariq Coy Joining Date"],["driving_license","Driving License"]];
function field(k,l,v=""){let val=v||"";if(k==="force_no"){const m=String(val).match(/^(SF-|US-|S-|C-)?(.*)$/i),prefix=(m?.[1]||"SF-").toUpperCase(),serial=m?.[2]||"";return '<label>'+l+'<div style="display:flex;gap:6px"><select name="force_prefix" class="field" style="width:100px;flex-shrink:0">'+["SF-","US-","S-","C-"].map(x=>'<option value="'+x+'" '+(x===prefix?"selected":"")+'>'+x+'</option>').join("")+'</select><input name="force_serial" type="text" inputmode="numeric" placeholder="Number" value="'+esc(serial)+'" required></div></label>'}if(k==="rank")return '<label>'+l+'<select name="'+k+'">'+["DD","AD","INSP","SI","ASI","SGT","CPL"].map(x=>'<option '+(x===val?"selected":"")+'>'+x+"</option>").join("")+"</select></label>";if(k==="living_status")return '<label>'+l+'<select name="'+k+'">'+["UNSET","IN","OUT"].map(x=>'<option '+(x===val?"selected":"")+'>'+x+"</option>").join("")+"</select></label>";if(k==="blood_group")return '<label>'+l+'<select name="'+k+'"><option value="">Select blood group</option>'+["A+","A-","B+","B-","AB+","AB-","O+","O-"].map(x=>'<option '+(x===val?"selected":"")+'>'+x+"</option>").join("")+"</select></label>";if(k==="marital_status")return '<label>'+l+'<select name="'+k+'"><option value="">Select status</option>'+["Single","Married","Divorced","Widowed"].map(x=>'<option '+(x===val?"selected":"")+'>'+x+"</option>").join("")+"</select></label>";if(k==="domicile")return '<label>'+l+'<select name="'+k+'"><option value="">Select domicile</option>'+["Punjab","Sindh","Khyber Pakhtunkhwa","Balochistan","Islamabad Capital Territory","Azad Jammu and Kashmir","Gilgit-Baltistan"].map(x=>'<option '+(x===val?"selected":"")+'>'+x+"</option>").join("")+"</select></label>";if(k==="cnic")return '<label>'+l+'<input id="cnicInput" name="cnic" type="text" inputmode="numeric" maxlength="15" placeholder="12345-1234567-1" value="'+esc(val)+'"></label>';if(k==="driving_license")return '<label>'+l+'<select name="'+k+'"><option>Yes</option><option '+(val==="No"?"selected":"")+'>'+ "No" +'</option></select></label>';let isDate=["date_of_birth","joining_date","current_rank_date","fsd_joining_date","tariq_coy_joining_date"].includes(k);return '<label>'+l+'<input name="'+k+'" type="text" '+(isDate?'placeholder="DD-MM-YYYY" inputmode="numeric"':'')+' value="'+esc(isDate?fmtDate(val):val)+'" '+(k==="name"?"required":"")+'></label>'}
const employeeFieldGroups=[
 ["Personal Information",["name","father_name","date_of_birth","education","religion","caste","blood_group","marital_status","no_of_children","cnic","living_status"]],
 ["Service Record",["force_no","rank","joining_date","current_rank_date","fsd_joining_date","tariq_coy_joining_date","driving_license"]],
 ["Contact & Address",["mobile_no","emergency_no","spouse_no","present_address","permanent_address","domicile"]],
 ["Courses",["courses"]]
];
function groupedFields(group,e,readOnly=false){
 const keys=group[1],items=fields.filter(f=>keys.includes(f[0]));
 return '<div class="panel"><div class="panelhead"><h2>'+esc(group[0])+'</h2></div><div class="formgrid">'+items.map(f=>{
  const val=e?e[f[0]]:"";
  if(!readOnly)return field(f[0],f[1],val||"");
  const shown=["date_of_birth","joining_date","current_rank_date","fsd_joining_date","tariq_coy_joining_date"].includes(f[0])?fmtDate(val):(val||"");
  return '<label>'+esc(f[1])+'<div style="padding:10px;border:1px solid #e1e8ef;border-radius:8px;background:#f8fafc;min-height:39px;overflow-wrap:anywhere">'+(shown!==""?esc(shown):'<span class="muted">Not provided</span>')+'</div></label>';
 }).join("")+'</div></div>';
}
function employeeForm(e=null){
 const body='<form id="ef">'+employeeFieldGroups.map(g=>groupedFields(g,e,false)).join("")+'<div class="panelhead"><button class="btn primary">Save Employee</button></div></form>';
 layout(title(e?"Edit Employee":"Add New Employee","Employee information arranged by section",'<button class="btn" id="back">Cancel</button>')+body);
 $("#back").onclick=()=>{if(e){openEmployee(e.id)}else{page="Employees";render()}};
 const cnic=$("#cnicInput");
 if(cnic){const formatCnic=()=>{const digits=cnic.value.replace(/\D/g,"").slice(0,13);cnic.value=digits.length>5?digits.slice(0,5)+"-"+digits.slice(5,12)+(digits.length>12?"-"+digits.slice(12):""):digits};cnic.addEventListener("input",formatCnic);formatCnic()}
 $("#ef").onsubmit=async ev=>{
  ev.preventDefault();let b=Object.fromEntries(new FormData(ev.currentTarget).entries());
  b.force_no=String(b.force_prefix||"SF-")+String(b.force_serial||"").trim();delete b.force_prefix;delete b.force_serial;
  if(!/^\d+$/.test(String(b.force_no).replace(/^(SF-|US-|S-|C-)/,""))){notify("Force number must contain a numeric serial after the prefix.","error");return}
  if(b.cnic){const digits=b.cnic.replace(/\D/g,"");if(digits.length!==13){notify("CNIC must contain 13 digits in 12345-1234567-1 format.","error");return}b.cnic=digits.slice(0,5)+"-"+digits.slice(5,12)+"-"+digits.slice(12)}
  for(let k of ["date_of_birth","joining_date","current_rank_date","fsd_joining_date","tariq_coy_joining_date"]){if(!b[k])b[k]=null;else{const parsed=parseDateInput(b[k]);if(!parsed){notify(k.replaceAll("_"," ")+" must be DD-MM-YYYY.","error");return}b[k]=parsed}}
  try{if(e)await api("/employees/"+e.id,{method:"PATCH",body:JSON.stringify(b)});else await post("/employees",b);await load();if(e){await openEmployee(e.id)}else{page="Employees";render()}notify(e?"Employee updated successfully.":"Employee added successfully.")}catch(x){notify(x.message,"error")}
 }
}
async function openEmployee(id){
 let d=await api("/employees/"+id),e=d.employee,ls=d.leaveRecords||[];
 const leaveTypes=[
  {type:"C_LEAVE",title:"C/Leave Record",hasBalance:true,reasonLabel:"Reason"},
  {type:"E_LEAVE",title:"E/Leave Record",hasBalance:false,reasonLabel:"Reason"},
  {type:"MEDICAL",title:"Medical Record",hasBalance:false,reasonLabel:"Remarks"}
 ];
 const leaveTable=g=>{
  const records=ls.filter(l=>String(l.leave_type||"").toUpperCase()===g.type);
  const cols='<th>Sr. No.</th><th>From</th><th>To</th><th>Days</th>'+(g.hasBalance?'<th>Balance</th>':'')+'<th>'+g.reasonLabel+'</th>';
  const rows=records.length?records.map((l,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(fmtDate(l.from_date))+'</td><td>'+esc(fmtDate(l.to_date))+'</td><td>'+esc(l.days??"")+'</td>'+(g.hasBalance?'<td>'+esc(l.balance||"")+'</td>':'')+'<td>'+esc(l.reason||"")+'</td></tr>').join(""):'<tr><td colspan="'+(g.hasBalance?6:5)+'" class="empty">No records yet.</td></tr>';
  return '<div class="panel"><div class="panelhead"><h2>'+g.title+'</h2></div><div class="tablewrap"><table><thead><tr>'+cols+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
 };
 layout(title(esc(e.name),esc(e.rank+" · "+e.force_no),'<button id="edit" class="btn">Edit</button> <button id="delete-employee" class="btn danger">Delete Employee</button> <button id="back" class="btn">Back</button>')+
 employeeFieldGroups.map(g=>groupedFields(g,e,true)).join("")+
 '<div class="panel"><div class="panelhead"><h2>Leave Records</h2><button id="addleave" class="btn primary">+ Add record</button></div></div>'+
 leaveTypes.map(leaveTable).join(""));
 $("#back").onclick=()=>{page="Employees";render()};
 $("#edit").onclick=()=>employeeForm(e);
 $("#delete-employee").onclick=async()=>{
  const approved=await confirmAction({title:"Delete Employee",message:"Remove "+e.name+" from the active register?",details:"<b>"+esc(e.name)+"</b><br>Force No.: "+esc(e.force_no)+"<br>Existing collection and leave history will be retained.",confirmLabel:"Confirm Delete",danger:true});
  if(!approved)return;
  try{await api("/employees/"+e.id,{method:"DELETE"});await load();page="Employees";render();notify("Employee deleted from the active register.")}catch(err){notify(err.message,"error")}
 };
 $("#addleave").onclick=()=>leaveForm(e.id);
}
function leaveForm(id){layout(title("Add Leave / Medical Record","C/Leave, E/Leave or Medical",'<button id="back" class="btn">Cancel</button>')+'<div class="panel"><form id="lf"><div class="formgrid"><label>Type<select name="leave_type"><option value="C_LEAVE">C/Leave</option><option value="E_LEAVE">E/Leave</option><option value="MEDICAL">Medical</option></select></label><label>From<input type="text" name="from_date" placeholder="DD-MM-YYYY" inputmode="numeric" required></label><label>To<input type="text" name="to_date" placeholder="DD-MM-YYYY" inputmode="numeric" required></label><label>Days<input type="number" min="0" name="days" required></label><label>Balance<input name="balance"></label><label>Remarks<input name="reason"></label></div><div class="panelhead"><button class="btn primary">Save record</button></div></form></div>');$("#back").onclick=()=>openEmployee(id);$("#lf").onsubmit=async ev=>{ev.preventDefault();let b=Object.fromEntries(new FormData(ev.currentTarget).entries());for(let k of ["from_date","to_date"]){const parsed=parseDateInput(b[k]);if(!parsed){notify(k==="from_date"?"From date must be DD-MM-YYYY.":"To date must be DD-MM-YYYY.","error");return}b[k]=parsed}b.days=Number(b.days);try{await post("/employees/"+id+"/leaves",b);await openEmployee(id);notify("Leave / medical record saved successfully.")}catch(e){notify(e.message,"error")}}}

 '</tbody></table></div></div>');

async function openCollectionPopup(employeeId){
 const employee=employees.find(e=>e.id===employeeId);if(!employee)return;
 let d=await api("/collections?month="+month),record=(d.collections||[]).find(r=>r.employee_id===employeeId)||null,initialError="";
 if(!record&&["IN","OUT"].includes(employee.living_status)){try{await post("/collections",{employee_id:employeeId,month_key:month,leave_days:0});d=await api("/collections?month="+month);record=(d.collections||[]).find(r=>r.employee_id===employeeId)||null}catch(e){initialError=e.message}}
 const host=document.createElement("div");host.id="collection-modal";host.className="modalback";
 function draw(){
  const r=record||{},isPaid=r.payment_status==="PAID";
  host.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h2>'+esc(employee.name)+(isPaid?' <span class="pill" style="font-size:10px;vertical-align:middle">Paid</span>':'')+'</h2><div class="muted">'+esc(employee.force_no)+' · '+esc(employee.rank)+' · '+esc(month)+'</div>'+
  (!["IN","OUT"].includes(employee.living_status)?'<p class="muted">Pehle Employee record mein Living Status (IN/OUT) set karein.</p>':'')+

  '<div class="amountline"><span>Monthly Contribution</span><b>Rs '+money(r.contribution_total)+'</b></div>'+
  '<div class="amountline"><span>Leave Deduction</span><b>Rs '+money(r.leave_deduction)+'</b></div>'+
  '<div class="amountline"><span>Mess / Ration</span><b>Rs '+money(r.mess_amount)+'</b></div>'+
  '<div class="amountline total"><span>Total Amount</span><span>Rs '+money(r.total_due)+'</span></div>'+
  '<p class="muted" id="pop-note">'+(r&&r.last_reversal_reason?"Previous receipt reversed: "+esc(r.last_reversal_reason):(r?"Amount saved for this month.":esc(initialError||"Enter leave days and select Calculate Amount.")))+'</p><div class="modalactions"><button id="pop-close" class="btn">Close</button>'+
  (!isPaid?'<button id="pop-calc" class="btn">'+(r?'Update Amount':'Calculate Amount')+'</button>':'')+
  (r&&!isPaid?'<button id="pop-receive" class="btn primary">Receive</button>':'')+(isPaid?'<button id="pop-reverse" class="btn" style="border-color:#b42318;color:#b42318">Reverse Receipt</button>':'')+'</div></div>';
  $("#pop-close").onclick=()=>host.remove();
  const calc=$("#pop-calc");if(calc)calc.onclick=async()=>{
   const leaves=Number($("#pop-leaves").value||0),manual=$("#pop-manual").value;
   const body={employee_id:employeeId,month_key:month,leave_days:leaves};
   if(manual!=="")body.manual_leave_deduction=Number(manual);
   calc.disabled=true;calc.textContent="Saving…";
   try{await post("/collections",body);const latest=await api("/collections?month="+month);record=(latest.collections||[]).find(x=>x.employee_id===employeeId)||null;draw();notify("Collection amount saved successfully.")}
   catch(e){const note=$("#pop-note");if(note)note.textContent=e.message;calc.disabled=false;calc.textContent=r?'Update Amount':'Calculate Amount'}
  };
  const receive=$("#pop-receive");if(receive)receive.onclick=async()=>{
   const approved=await confirmAction({title:"Confirm Payment",message:"Receive the full payment for "+employee.name+"?",details:"Force Number: "+esc(employee.force_no)+"<br>Month: "+esc(month)+"<br><b>Amount: Rs "+money(r.total_due)+"</b>",confirmLabel:"Confirm Receive"});if(!approved)return;
   receive.disabled=true;
   try{await post("/collections/"+r.id+"/receive",{payment_date:new Date().toISOString().slice(0,10),payment_method:"Cash"});host.remove();await collection();notify("Payment received successfully.")}
   catch(e){const note=$("#pop-note");if(note)note.textContent=e.message;receive.disabled=false}
  };
  const reverse=$("#pop-reverse");if(reverse)reverse.onclick=()=>{
   const prompt=document.createElement("div");prompt.className="modalback confirm-modal";prompt.style.zIndex="1100";
   prompt.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="reverse-title"><h2 id="reverse-title">Reverse Receipt</h2><p class="confirm-message">This will mark the selected receipt as reversed and return this employee to Pending. The original receipt will remain in D1 history.</p><div class="confirm-details"><b>'+esc(employee.name)+'</b><br>Force Number: '+esc(employee.force_no)+'<br>Month: '+esc(month)+'<br><b>Receipt amount: Rs '+money(r.total_due)+'</b></div><div class="fieldrow"><label>Reason<select id="reverse-reason" class="field"><option value="">Select reason</option><option>Wrong employee</option><option>Wrong amount</option><option>Duplicate receipt</option><option>Other</option></select></label><label>Additional details<input id="reverse-details" class="field" maxlength="250" placeholder="Optional details"></label></div><label style="display:grid;gap:6px;margin-top:10px">Type REVERSE to confirm<input id="reverse-word" class="field" autocomplete="off" placeholder="REVERSE" maxlength="20"></label><p class="muted" id="reverse-error">Please verify the employee, month and amount before continuing.</p><div class="modalactions"><button type="button" class="btn" data-reverse-cancel>Cancel</button><button type="button" class="btn danger" data-reverse-ok disabled>Confirm Reverse</button></div></div>';
   const reasonInput=prompt.querySelector("#reverse-reason"),detailInput=prompt.querySelector("#reverse-details"),wordInput=prompt.querySelector("#reverse-word"),confirmBtn=prompt.querySelector("[data-reverse-ok]");
   const updateReady=()=>{confirmBtn.disabled=!(reasonInput.value&&wordInput.value.trim()==="REVERSE"&&(reasonInput.value!=="Other"||detailInput.value.trim()))};
   reasonInput.onchange=updateReady;detailInput.oninput=updateReady;wordInput.oninput=updateReady;
   const closePrompt=()=>prompt.remove();
   prompt.querySelector("[data-reverse-cancel]").onclick=closePrompt;
   prompt.addEventListener("click",ev=>{if(ev.target===prompt)closePrompt()});
   confirmBtn.onclick=async()=>{
    if(confirmBtn.disabled)return;
    const reason=reasonInput.value+(detailInput.value.trim()?": "+detailInput.value.trim():"");
    confirmBtn.disabled=true;confirmBtn.textContent="Reversing…";
    try{
     await post("/collections/"+r.id+"/reverse",{employee_id:employeeId,month_key:month,amount:Number(r.total_due),reason,confirmation:wordInput.value.trim()});

    }catch(err){const errorBox=prompt.querySelector("#reverse-error");if(errorBox)errorBox.textContent=err.message;confirmBtn.textContent="Confirm Reverse";updateReady();notify(err.message,"error")}
   };
   document.body.appendChild(prompt);wordInput.focus();
  };
 }
 document.body.appendChild(host);draw();
}

function reports(){let ts=[["nominal-role","Nominal Roll"],["driving-license","Driving License"],["monthly-contribution","Monthly Contribution"],["mess","Ration Money / Mess"],["full-collection","Full Collection"],["leave-medical","C/Leave + E/Leave + Medical"]];layout(title("Reports","Select a report, then export CSV or save a print-ready PDF",'<input id="month" class="field noprint" type="month" value="'+month+'">')+'<div class="cards noprint">'+ts.map(t=>'<button class="card" data-report="'+t[0]+'"><label>REPORT</label><strong style="font-size:16px">'+t[1]+'</strong></button>').join("")+'</div><div id="result"></div>');$("#month").onchange=e=>{month=e.target.value};document.querySelectorAll("[data-report]").forEach(b=>b.onclick=async()=>{try{let reportId=b.dataset.report,d=await api("/reports/"+reportId+(['monthly-contribution','mess','full-collection'].includes(reportId)?"?month="+month:"")),rs=d.rows||[];

 const cs=cols[reportId]||[],reportTitle=titles[reportId]||"Report",dateText=formatNowDate(),period=["monthly-contribution","mess","full-collection"].includes(reportId)?"Reporting Month: "+month:"Generated: "+dateText;

 $("#csv").onclick=()=>{let s=[cs.map(k=>q(labels[k]||k)).join(","),...rs.map((r,i)=>cs.map(k=>q(reportValue(k,r[k],i))).join(","))].join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv;charset=utf-8"}));a.download=reportId+"-"+month+".csv";a.click();URL.revokeObjectURL(a.href)};
 $("#pdf").onclick=()=>window.print();
 }catch(e){notify(e.message,"error")}})}async function rates(){let d=await api("/rates?month="+month),rs=d.rates||[];layout(title("Contribution Rates","Rank and living status rates",'<input id="month" class="field" type="month" value="'+month+'"> <button id="newrate" class="btn primary">+ Add rate</button>')+'<div class="panel"><div class="tablewrap"><table><tr><th>Rank</th><th>Living</th><th>Welfare</th><th>MOD</th><th>MED</th><th>Barber</th><th>Waiter</th><th>W.Man</th><th>Total</th></tr>'+ratesRankSorted(rs).map(r=>{let total=["welfare","mod_amount","med","barber","waiter","wman"].reduce((s,k)=>s+Number(r[k]||0),0);return '<tr>'+["rank","living_status"].map(k=>'<td>'+esc(r[k])+'</td>').join("")+["welfare","mod_amount","med","barber","waiter","wman"].map(k=>'<td>'+money(r[k])+'</td>').join("")+'<td><b>Rs '+money(total)+'</b></td></tr>'}).join("")+'</table></div></div>');$("#month").onchange=e=>{month=e.target.value;render()};$("#newrate").onclick=rateForm}

async function login(){
 let status=null,statusError="";
 try{status=await api("/setup-status")}catch(e){statusError=e.message||"Unable to check first-time setup."}
 const showSetup=async()=>{
  let secretRequired=Boolean(status&&status.setupSecretRequired);
  $("#app").innerHTML='<div class="login"><form id="setup"><h1>Tariq Coy</h1><p class="muted">First-time administrator setup</p><p>Create the first administrator account. Setup automatically closes after the first account is created.</p>'+(statusError?'<p class="error">'+esc(statusError)+'</p>':'')+'<label>Admin username<input name="username" required minlength="3" maxlength="50" autocomplete="username"></label><label>Password (minimum 12 characters)<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label>'+(secretRequired?'<label>Bootstrap secret<input name="secret" type="password" required autocomplete="off"></label>':'')+'<button class="btn primary">Create admin account</button><p id="err" class="error"></p><button type="button" id="backlogin" class="btn">Back to sign in</button></form></div>';
  $("#backlogin").onclick=()=>login(true);
  $("#setup").onsubmit=async e=>{
   e.preventDefault();const form=e.currentTarget,f=new FormData(form),headers={"Content-Type":"application/json"};
   if(form.elements.secret)headers["x-bootstrap-secret"]=f.get("secret");
   try{const r=await fetch("/api/setup-admin",{method:"POST",headers,body:JSON.stringify({username:f.get("username"),password:f.get("password")})});const d=await r.json();if(!r.ok)throw Error(d.error||"Setup failed");await login(true);const setupMessage=$("#err");if(setupMessage)setupMessage.textContent="First administrator account created. Please sign in."}catch(x){$("#err").textContent=x.message}
  };
 };
 if(!status||status.setupRequired){await showSetup();return;}
 $("#app").innerHTML='<div class="login"><form id="login"><h1>Tariq Coy</h1><p class="muted">Personnel Record Management System</p><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary">Sign in</button><p id="err" class="error"></p><button type="button" id="firstsetup" class="btn">First-time account setup</button></form></div>';
 $("#firstsetup").onclick=async()=>{statusError="";await showSetup()};
 $("#login").onsubmit=async e=>{e.preventDefault();try{user=(await post("/login",Object.fromEntries(new FormData(e.currentTarget).entries()))).user;await load();page="Home";render()}catch(x){$("#err").textContent=x.message}}
}
