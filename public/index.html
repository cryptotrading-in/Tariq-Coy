/* Premium Contribution Rates finish: restrained fintech/editorial styling */
.rate-month-label{gap:9px;color:#7b8998;font-size:10px;font-weight:800;letter-spacing:.12em}

.rank-mark-1{background:linear-gradient(145deg,#eaf0fc,#dce6f9);box-shadow:inset 0 0 0 1px #d3dff4}.rank-mark-1:after{background:#5374b8}

.rank-mark-6{background:linear-gradient(145deg,#edf1f5,#dfe6ec);box-shadow:inset 0 0 0 1px #d8e0e7}.rank-mark-6:after{background:#617488}
