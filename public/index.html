<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tariq Coy</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f3f6fa;color:#183047}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#102a43;color:white;padding:20px}.nav button{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:8px;background:transparent;color:#d9e5ef;margin:3px 0}.nav button.active{background:#244560}.main{min-width:0}.top,.panelhead{background:white;padding:16px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #e1e8ef}.content{padding:24px;max-width:1400px;margin:auto}h1{font-size:24px;margin:0 0 5px}h2{font-size:15px;margin:0}.muted{color:#718096;font-size:12px}.btn,input,select{font:inherit}.btn,.field{padding:9px 11px;border:1px solid #d4dfeb;border-radius:8px;background:white}.btn{cursor:pointer}.primary{background:#176b57;color:white;border-color:#176b57}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.card,.panel{background:white;border:1px solid #e0e8f0;border-radius:12px;padding:16px}.card label{display:block;color:#718096;font-size:12px}.card strong{display:block;font-size:24px;margin-top:8px}.panel{padding:0;overflow:hidden;margin:14px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid #edf1f5}th{background:#f8fafc;font-size:11px;color:#63778b;text-transform:uppercase}.pill{border-radius:20px;padding:4px 8px;background:#e5f4ec;color:#176b57;font-size:11px;font-weight:bold}.out{background:#fff0dc;color:#9a5700}.unset{background:#feeceb;color:#b42318}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px}.formgrid label{display:grid;gap:6px;font-size:12px}.formgrid input,.formgrid select{width:100%;padding:10px;border:1px solid #d4dfeb;border-radius:8px}.empty{text-align:center;padding:35px;color:#718096}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{padding:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.content{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.formgrid{grid-template-columns:1fr}.content{padding:10px}}
</style></head><body><div id="app">Loading…</div>
<script>
const $=s=>document.querySelector(s);let user=null,employees=[],page="Home",month=new Date().toISOString().slice(0,7);
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function api(path,opts={}){let r=await fetch("/api"+path,{credentials:"same-origin",...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function post(p,b){return api(p,{method:"POST",body:JSON.stringify(b)})}function pill(s){return '<span class="pill '+(s==="OUT"?"out":s==="UNSET"?"unset":"")+'">'+esc(s||"UNSET")+"</span>"}
function nav(){return ["Home","Employees","Collection","History","Reports","Contribution Rates","Settings"].map(x=>'<button class="'+(page===x?"active":"")+'" data-page="'+x+'">'+x+"</button>").join("")}
function layout(body){$("#app").innerHTML='<div class="shell"><aside class="side"><b>TARIQ COY</b><p class="muted">Personnel Management</p><nav class="nav">'+nav()+'</nav></aside><main class="main"><header class="top"><div><b>'+page+'</b><div class="muted">'+month+'</div></div><div class="muted">Temporary working mode</div></header><section class="content">'+body+'</section></main></div>';document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});}
function title(t,s,action=""){return '<div class="panelhead"><div><h1>'+t+'</h1><div class="muted">'+s+'</div></div>'+action+"</div>"}
function list(){return '<div class="panel"><div class="panelhead"><h2>Employee Register ('+employees.length+')</h2><button id="add" class="btn primary">+ Add employee</button></div><div class="tablewrap"><table><thead><tr><th>Sr. No.</th><th>Force No.</th><th>Rank</th><th>Name</th><th>Living</th><th>Action</th></tr></thead><tbody>'+employees.map((e,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(e.force_no)+'</td><td>'+esc(e.rank)+'</td><td>'+esc(e.name)+'</td><td>'+pill(e.living_status)+'</td><td><button class="btn" data-open="'+e.id+'">Open</button></td></tr>').join("")+'</tbody></table></div></div>'}
function home(){let ins=employees.filter(e=>e.living_status==="IN").length,outs=employees.filter(e=>e.living_status==="OUT").length;return title("Personnel Overview","Approved master register")+'<div class="cards"><div class="card"><label>Total Employees</label><strong>'+employees.length+'</strong></div><div class="card"><label>IN Living</label><strong>'+ins+'</strong></div><div class="card"><label>OUT Living</label><strong>'+outs+'</strong></div><div class="card"><label>Unconfirmed</label><strong>'+(employees.length-ins-outs)+'</strong></div></div>'+list()}
const fields=[["force_no","Force No."],["rank","Rank"],["name","Name"],["father_name","Father Name"],["date_of_birth","Date of Birth"],["education","Education"],["religion","Religion"],["caste","Caste"],["joining_date","Joining Date"],["current_rank_date","Current Rank Date"],["fsd_joining_date","FSD Joining Date"],["blood_group","Blood Group"],["mobile_no","Mobile No."],["emergency_no","Emergency No."],["living_status","Living Status"],["marital_status","Marital Status"],["no_of_children","No. of Children"],["spouse_no","Spouse Contact"],["courses","Courses"],["present_address","Present Address"],["permanent_address","Permanent Address"],["domicile","Domicile"],["cnic","CNIC"],["tariq_coy_joining_date","Tariq Coy Joining Date"],["driving_license","Driving License"]];
function field(k,l,v=""){let val=v||"";if(k==="rank")return '<label>'+l+'<select name="'+k+'">'+["DD","AD","INSP","SI","ASI","SGT","CPL"].map(x=>'<option '+(x===val?"selected":"")+'>'+x+"</option>").join("")+"</select></label>";if(k==="living_status")return '<label>'+l+'<select name="'+k+'">'+["UNSET","IN","OUT"].map(x=>'<option '+(x===val?"selected":"")+'>'+x+"</option>").join("")+"</select></label>";if(k==="driving_license")return '<label>'+l+'<select name="'+k+'"><option>Yes</option><option '+(val==="No"?"selected":"")+'>No</option></select></label>';let type=["date_of_birth","joining_date","current_rank_date","fsd_joining_date","tariq_coy_joining_date"].includes(k)?"date":"text";return '<label>'+l+'<input name="'+k+'" type="'+type+'" value="'+esc(val)+'" '+(["force_no","name"].includes(k)?"required":"")+"></label>"}
function employeeForm(e=null){layout(title(e?"Edit Employee":"Add New Employee","Personal and service information",'<button class="btn" id="back">Cancel</button>')+'<div class="panel"><form id="ef"><div class="formgrid">'+fields.map(f=>field(f[0],f[1],e?e[f[0]]:"")).join("")+'</div><div class="panelhead"><button class="btn primary">Save Employee</button></div></form></div>');$("#back").onclick=()=>{page="Employees";render()};$("#ef").onsubmit=async ev=>{ev.preventDefault();let b=Object.fromEntries(new FormData(ev.currentTarget).entries());for(let k of ["date_of_birth","joining_date","current_rank_date","fsd_joining_date","tariq_coy_joining_date"])if(!b[k])b[k]=null;try{if(e)await api("/employees/"+e.id,{method:"PATCH",body:JSON.stringify(b)});else await post("/employees",b);await load();page="Employees";render()}catch(x){alert(x.message)}}}
async function openEmployee(id){let d=await api("/employees/"+id),e=d.employee,ls=d.leaveRecords||[];layout(title(esc(e.name),esc(e.rank+" · "+e.force_no),'<button id="edit" class="btn">Edit</button> <button id="back" class="btn">Back</button>')+'<div class="panel"><div class="formgrid">'+fields.map(f=>'<label>'+f[1]+'<input disabled value="'+esc(e[f[0]]||"")+'"></label>').join("")+'</div></div><div class="panel"><div class="panelhead"><h2>C/Leave · E/Leave · Medical</h2><button id="addleave" class="btn primary">+ Add record</button></div><div class="tablewrap"><table><tr><th>Sr. No.</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Balance</th></tr>'+ls.map((l,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(l.leave_type)+'</td><td>'+esc(l.from_date)+'</td><td>'+esc(l.to_date)+'</td><td>'+l.days+'</td><td>'+esc(l.balance||"")+'</td></tr>').join("")+'</table></div></div>');$("#back").onclick=()=>{page="Employees";render()};$("#edit").onclick=()=>employeeForm(e);$("#addleave").onclick=()=>leaveForm(e.id)}
function leaveForm(id){layout(title("Add Leave / Medical Record","C/Leave, E/Leave or Medical",'<button id="back" class="btn">Cancel</button>')+'<div class="panel"><form id="lf"><div class="formgrid"><label>Type<select name="leave_type"><option value="C_LEAVE">C/Leave</option><option value="E_LEAVE">E/Leave</option><option value="MEDICAL">Medical</option></select></label><label>From<input type="date" name="from_date" required></label><label>To<input type="date" name="to_date" required></label><label>Days<input type="number" min="0" name="days" required></label><label>Balance<input name="balance"></label><label>Remarks<input name="reason"></label></div><div class="panelhead"><button class="btn primary">Save record</button></div></form></div>');$("#back").onclick=()=>openEmployee(id);$("#lf").onsubmit=async ev=>{ev.preventDefault();let b=Object.fromEntries(new FormData(ev.currentTarget).entries());b.days=Number(b.days);try{await post("/employees/"+id+"/leaves",b);await openEmployee(id)}catch(e){alert(e.message)}}}
async function collection(){let d=await api("/collections?month="+month),rows=d.collections||[];layout(title("Monthly Collection","Contribution and mess together; reports separately",'<input id="month" class="field" type="month" value="'+month+'">')+'<div class="cards"><div class="card"><label>Employees</label><strong>'+rows.length+'</strong></div><div class="card"><label>Total Due</label><strong>Rs '+rows.reduce((s,r)=>s+Number(r.total_due||0),0)+'</strong></div><div class="card"><label>Paid</label><strong>'+rows.filter(r=>r.payment_status==="PAID").length+'</strong></div><div class="card"><label>Pending</label><strong>'+rows.filter(r=>r.payment_status!=="PAID").length+'</strong></div></div><div class="panel"><div class="tablewrap"><table><tr><th>Force No.</th><th>Rank / Name</th><th>Living</th><th>Leave Days</th><th>Manual Deduction</th><th>Mess</th><th>Contribution</th><th>Total</th><th>Action</th></tr>'+employees.map(e=>{let r=rows.find(x=>x.employee_id===e.id)||{};return '<tr data-row="'+e.id+'"><td>'+esc(e.force_no)+'</td><td>'+esc(e.rank+" "+e.name)+'</td><td>'+pill(e.living_status)+'</td><td><input class="field" name="days" type="number" min="0" max="31" value="'+(r.leave_days||0)+'"></td><td><input class="field" name="manual" type="number" min="0" max="7000" placeholder="Auto" value="'+(r.leave_deduction_mode==="manual"?r.leave_deduction:"")+'"></td><td>'+Number(r.mess_amount||0)+'</td><td>'+Number(r.contribution_total||0)+'</td><td>'+Number(r.total_due||0)+'</td><td><button class="btn" data-save="'+e.id+'">Save</button> '+(r.id&&r.payment_status!=="PAID"?'<button class="btn primary" data-pay="'+r.id+'">Receive</button>':"")+'</td></tr>'}).join("")+'</table></div></div>');$("#month").onchange=e=>{month=e.target.value;render()};document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{let row=document.querySelector('[data-row="'+b.dataset.save+'"]'),body={employee_id:b.dataset.save,month_key:month,leave_days:Number(row.querySelector('[name=days]').value||0)},m=row.querySelector('[name=manual]').value;if(m!=="")body.manual_leave_deduction=Number(m);try{await post("/collections",body);await collection()}catch(e){alert(e.message)}});document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=async()=>{let date=prompt("Payment date YYYY-MM-DD",new Date().toISOString().slice(0,10));if(!date)return;let method=prompt("Cash, Bank Transfer, or Other","Cash");if(!method)return;try{await post("/collections/"+b.dataset.pay+"/receive",{payment_date:date,payment_method:method});await collection()}catch(e){alert(e.message)}})}
async function history(){let d=await api("/history?limit=500"),rows=(d.collections||[]).filter(r=>r.month_key===month);layout(title("Collection History","Monthly saved records",'<input id="month" class="field" type="month" value="'+month+'">')+'<div class="panel"><div class="tablewrap"><table><tr><th>Sr.</th><th>Month</th><th>Force No.</th><th>Rank / Name</th><th>Contribution</th><th>Mess</th><th>Total</th><th>Status</th></tr>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.month_key+'</td><td>'+esc(r.force_no)+'</td><td>'+esc(r.rank+" "+r.name)+'</td><td>'+r.contribution_total+'</td><td>'+r.mess_amount+'</td><td>'+r.total_due+'</td><td>'+pill(r.payment_status)+'</td></tr>').join("")+'</table></div></div>');$("#month").onchange=e=>{month=e.target.value;render()}}
function reports(){let ts=[["nominal-role","Nominal Roll"],["driving-license","Driving License"],["monthly-contribution","Monthly Contribution"],["mess","Ration Money / Mess"],["full-collection","Full Collection"],["leave-medical","C/Leave + E/Leave + Medical"]];layout(title("Reports","Serial-numbered reports",'<input id="month" class="field" type="month" value="'+month+'">')+'<div class="cards">'+ts.map(t=>'<button class="card" data-report="'+t[0]+'"><label>REPORT</label><strong style="font-size:16px">'+t[1]+'</strong></button>').join("")+'</div><div id="result"></div>');$("#month").onchange=e=>month=e.target.value;document.querySelectorAll("[data-report]").forEach(b=>b.onclick=async()=>{try{let d=await api("/reports/"+b.dataset.report+(['monthly-contribution','mess','full-collection'].includes(b.dataset.report)?"?month="+month:"")),rs=d.rows||[],cs=rs.length?Object.keys(rs[0]):[];$("#result").innerHTML='<div class="panel"><div class="panelhead"><h2>'+b.dataset.report+'</h2><button id="csv" class="btn primary">Export CSV</button></div><div class="tablewrap"><table><tr>'+cs.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr>'+rs.map(r=>'<tr>'+cs.map(c=>'<td>'+esc(r[c])+'</td>').join("")+'</tr>').join("")+'</table></div></div>';$("#csv").onclick=()=>{let q=x=>'"'+String(x??"").replace(/"/g,'""')+'"',s=[cs.map(q).join(","),...rs.map(r=>cs.map(c=>q(r[c])).join(","))].join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv;charset=utf-8"}));a.download=b.dataset.report+"-"+month+".csv";a.click()}}catch(e){alert(e.message)}})}
async function rates(){let d=await api("/rates?month="+month),rs=d.rates||[];layout(title("Contribution Rates","Rank and living status rates",'<input id="month" class="field" type="month" value="'+month+'"> <button id="newrate" class="btn primary">+ Add rate</button>')+'<div class="panel"><div class="tablewrap"><table><tr><th>Rank</th><th>Living</th><th>Welfare</th><th>MOD</th><th>MED</th><th>Barber</th><th>Waiter</th><th>W.Man</th><th>Effective</th></tr>'+rs.map(r=>'<tr>'+["rank","living_status","welfare","mod_amount","med","barber","waiter","wman","effective_from"].map(k=>'<td>'+esc(r[k])+'</td>').join("")+'</tr>').join("")+'</table></div></div>');$("#month").onchange=e=>{month=e.target.value;render()};$("#newrate").onclick=rateForm}
function rateForm(){layout(title("Add Contribution Rate","Rate effective month",'<button id="back" class="btn">Cancel</button>')+'<div class="panel"><form id="rf"><div class="formgrid"><label>Rank<select name="rank">'+["DD","AD","INSP","SI","ASI","SGT","CPL"].map(x=>'<option>'+x+'</option>').join("")+'</select></label><label>Living<select name="living_status"><option>IN</option><option>OUT</option></select></label><label>Effective month<input name="effective_from" type="month" value="'+month+'" required></label>'+["welfare","mod_amount","med","barber","waiter","wman"].map(k=>'<label>'+k+'<input name="'+k+'" type="number" min="0" step=".01" value="0" required></label>').join("")+'</div><div class="panelhead"><button class="btn primary">Save Rate</button></div></form></div>');$("#back").onclick=()=>{page="Contribution Rates";render()};$("#rf").onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.currentTarget).entries());for(let k of ["welfare","mod_amount","med","barber","waiter","wman"])b[k]=Number(b[k]);try{await post("/rates",b);render()}catch(x){alert(x.message)}}}
function settings(){layout(title("Settings","Temporary no-login working mode")+'<div class="cards"><div class="card"><label>Access</label><strong style="font-size:18px">No login</strong></div><div class="card"><label>Security</label><strong style="font-size:18px">Development only</strong></div><div class="card"><label>Storage</label><strong style="font-size:18px">Cloudflare D1</strong></div></div><p class="muted">Do not expose this version publicly. Authentication must be restored before production use.</p>')}
async function load(){employees=(await api("/employees")).employees||[]}async function render(){try{if(page==="Home"){layout(home());$("#add").onclick=()=>employeeForm()}else if(page==="Employees"){layout(title("Employees","Personnel master register",'<button id="add" class="btn primary">+ Add employee</button>')+list());$("#add").onclick=()=>employeeForm();document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openEmployee(b.dataset.open))}else if(page==="Collection")await collection();else if(page==="History")await history();else if(page==="Reports")reports();else if(page==="Contribution Rates")await rates();else settings()}catch(e){layout(title(page,"Unable to load section")+'<p>'+esc(e.message)+'</p>')}}
async function start(){user={id:null,username:"Working mode",role:"admin"};try{await load();render()}catch(e){layout(title("Application","Unable to load section")+"<p>"+esc(e.message)+"</p>")}}start();
</script></body></html>
