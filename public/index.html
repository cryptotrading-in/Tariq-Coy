 $("#pdf").onclick=()=>window.print();
 }catch(e){alert(e.message)}})}async function rates(){let d=await api("/rates?month="+month),rs=d.rates||[];layout(title("Contribution Rates","Rank and living status rates",'<input id="month" class="field" type="month" value="'+month+'"> <button id="newrate" class="btn primary">+ Add rate</button>')+'<div class="panel"><div class="tablewrap"><table><tr><th>Rank</th><th>Living</th><th>Welfare</th><th>MOD</th><th>MED</th><th>Barber</th><th>Waiter</th><th>W.Man</th><th>Total</th></tr>'+ratesRankSorted(rs).map(r=>{let total=["welfare","mod_amount","med","barber","waiter","wman"].reduce((s,k)=>s+Number(r[k]||0),0);return '<tr>'+["rank","living_status"].map(k=>'<td>'+esc(r[k])+'</td>').join("")+["welfare","mod_amount","med","barber","waiter","wman"].map(k=>'<td>'+money(r[k])+'</td>').join("")+'<td><b>Rs '+money(total)+'</b></td></tr>'}).join("")+'</table></div></div>');$("#month").onchange=e=>{month=e.target.value;render()};$("#newrate").onclick=rateForm}

async function login(){
 let status=null,statusError="";
 try{status=await api("/setup-status")}catch(e){statusError=e.message||"Unable to check first-time setup."}
 const showSetup=async()=>{
  let secretRequired=Boolean(status&&status.setupSecretRequired);
  $("#app").innerHTML='<div class="login"><form id="setup"><h1>Tariq Coy</h1><p class="muted">First-time administrator setup</p><p>Create the first administrator account. Setup automatically closes after the first account is created.</p>'+(statusError?'<p class="error">'+esc(statusError)+'</p>':'')+'<label>Admin username<input name="username" required minlength="3" maxlength="50" autocomplete="username"></label><label>Password (minimum 12 characters)<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label>'+(secretRequired?'<label>Bootstrap secret<input name="secret" type="password" required autocomplete="off"></label>':'')+'<button class="btn primary">Create admin account</button><p id="err" class="error"></p><button type="button" id="backlogin" class="btn">Back to sign in</button></form></div>';
  $("#backlogin").onclick=()=>login(true);
  $("#setup").onsubmit=async e=>{
   e.preventDefault();const form=e.currentTarget,f=new FormData(form),headers={"Content-Type":"application/json"};
   if(form.elements.secret)headers["x-bootstrap-secret"]=f.get("secret");
   try{const r=await fetch("/api/setup-admin",{method:"POST",headers,body:JSON.stringify({username:f.get("username"),password:f.get("password")})});const d=await r.json();if(!r.ok)throw Error(d.error||"Setup failed");alert("First administrator account created. Please sign in.");login(true)}catch(x){$("#err").textContent=x.message}
  };
 };
 if(!status||status.setupRequired){await showSetup();return;}
 $("#app").innerHTML='<div class="login"><form id="login"><h1>Tariq Coy</h1><p class="muted">Personnel Record Management System</p><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary">Sign in</button><p id="err" class="error"></p><button type="button" id="firstsetup" class="btn">First-time account setup</button></form></div>';
 $("#firstsetup").onclick=async()=>{statusError="";await showSetup()};
 $("#login").onsubmit=async e=>{e.preventDefault();try{user=(await post("/login",Object.fromEntries(new FormData(e.currentTarget).entries()))).user;await load();page="Home";render()}catch(x){$("#err").textContent=x.message}}
}
