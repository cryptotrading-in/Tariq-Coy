<script>
const $=s=>document.querySelector(s);let user=null,employees=[],page="Home",month=new Date().toISOString().slice(0,7);
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const RANK_ORDER=["DD","AD","INSP","SI","ASI","SGT","CPL"];
function rankSorted(list){const order=new Map(RANK_ORDER.map((r,i)=>[r,i]));return [...list].sort((a,b)=>{const d=(order.get(String(a.rank||"").toUpperCase())??999)-(order.get(String(b.rank||"").toUpperCase())??999);if(d)return d;const an=Number((String(a.force_no||"").match(/(\d+)$/)||[0,"0"])[1]),bn=Number((String(b.force_no||"").match(/(\d+)$/)||[0,"0"])[1]);return an-bn||String(a.force_no||"").localeCompare(String(b.force_no||""))})}
function ratesRankSorted(list){const order=new Map(RANK_ORDER.map((r,i)=>[r,i]));return [...list].sort((a,b)=>{const ar=String(a.rank||"").toUpperCase(),br=String(b.rank||"").toUpperCase();const d=(order.get(ar)??999)-(order.get(br)??999);if(d)return d;const livingOrder={IN:0,OUT:1};const ls=(livingOrder[String(a.living_status||"").toUpperCase()]??2)-(livingOrder[String(b.living_status||"").toUpperCase()]??2);if(ls)return ls;return String(a.effective_from||"").localeCompare(String(b.effective_from||""))})}
function money(v){return Math.round(Number(v)||0).toLocaleString("en-PK",{maximumFractionDigits:0})}
function fmtDate(v){if(!v)return "";let s=String(v).slice(0,10),m=s.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);return m?m[3]+"-"+m[2]+"-"+m[1]:s}
function parseDateInput(v){if(!v)return "";let m=String(v).trim().match(/^(\\d{2})-(\\d{2})-(\\d{4})$/);if(!m)return "";let iso=m[3]+"-"+m[2]+"-"+m[1],d=new Date(iso+"T00:00:00Z");return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===iso?iso:""}
function formatNowDate(){let d=new Date();return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear()}
function reportValue(k,v,i){let value=k==="sr_no"?(v??i+1):(v??"");if(/(^date$|_date$|^from_date$|^to_date$|^payment_date$)/.test(k))return fmtDate(value);if(["welfare","mod_amount","med","barber","waiter","wman","contribution_total","mess_amount","leave_deduction","total_due","mess_base"].includes(k))return money(value);return value}
async function api(path,opts={}){let r=await fetch("/api"+path,{credentials:"same-origin",...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function post(p,b){return api(p,{method:"POST",body:JSON.stringify(b)})}function pill(s){return '<span class="pill '+(s==="OUT"?"out":s==="UNSET"?"unset":"")+'">'+esc(s||"UNSET")+"</span>"}
function nav(){return ["Home","Employees","Collection","History","Reports","Contribution Rates","Settings"].map(x=>'<button class="'+(page===x?"active":"")+'" data-page="'+x+'">'+x+"</button>").join("")}
function layout(body){$("#app").innerHTML='<div class="shell"><aside class="side"><b>TARIQ COY</b><p class="muted">Personnel Management</p><nav class="nav">'+nav()+'</nav></aside><main class="main"><header class="top"><div><b>'+page+'</b><div class="muted">'+month+'</div></div><div>'+esc(user.username)+' <button id="logout" class="btn">Log out</button></div></header><section class="content">'+body+'</section></main></div>';document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$("#logout").onclick=logout}
function title(t,s,action=""){return '<div class="panelhead"><div><h1>'+t+'</h1><div class="muted">'+s+'</div></div>'+action+"</div>"}
function list(){return '<div class="panel"><div class="panelhead"><h2>Employee Register ('+employees.length+')</h2><button id="add" class="btn primary">+ Add employee</button></div><div class="tablewrap"><table><thead><tr><th>Sr. No.</th><th>Force No.</th><th>Rank</th><th>Name</th><th>Living</th><th>Action</th></tr></thead><tbody>'+rankSorted(employees).map((e,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(e.force_no)+'</td><td>'+esc(e.rank)+'</td><td>'+esc(e.name)+'</td><td>'+pill(e.living_status)+'</td><td><button class="btn" data-open="'+e.id+'">Open</button> <button class="btn" data-delete="'+e.id+'">Delete</button></td></tr>').join("")+'</tbody></table></div></div>'}
function home(){let ins=employees.filter(e=>e.living_status==="IN").length,outs=employees.filter(e=>e.living_status==="OUT").length;return title("Personnel Overview","Approved master register")+'<div class="cards"><div class="card"><label>Total Employees</label><strong>'+employees.length+'</strong></div><div class="card"><label>IN Living</label><strong>'+ins+'</strong></div><div class="card"><label>OUT Living</label><strong>'+outs+'</strong></div><div class="card"><label>Unconfirmed</label><strong>'+(employees.length-ins-outs)+'</strong></div></div>'+list()}
const fields=[["force_no","Force No."],["rank","Rank"],["name","Name"],["father_name","Father Name"],["date_of_birth","Date of Birth"],["education","Education"],["religion","Religion"],["caste","Caste"],["joining_date","Joining Date"],["current_rank_date","Current Rank Date"],["fsd_joining_date","FSD Joining Date"],["blood_group","Blood Group"],["mobile_no","Mobile No."],["emergency_no","Emergency No."],["living_status","Living Status"],["marital_status","Marital Status"],["no_of_children","No. of Children"],["spouse_no","Spouse Contact"],["courses","Courses"],["present_address","Present Address"],["permanent_address","Permanent Address"],["domicile","Domicile"],["cnic","CNIC"],["tariq_coy_joining_date","Tariq Coy Joining Date"],["driving_license","Driving License"]];
function field(k,l,v=""){let val=v||"";if(k==="rank")return '<label>'+l+'<select name="'+k+'">'+["DD","AD","INSP","SI","ASI","SGT","CPL"].map(x=>'<option '+(x===val?"selected":"")+'>'+x+"</option>").join("")+"</select></label>";if(k==="living_status")return '<label>'+l+'<select name="'+k+'">'+["UNSET","IN","OUT"].map(x=>'<option '+(x===val?"selected":"")+'>'+x+"</option>").join("")+"</select></label>";if(k==="driving_license")return '<label>'+l+'<select name="'+k+'"><option>Yes</option><option '+(val==="No"?"selected":"")+'>No</option></select></label>';let isDate=["date_of_birth","joining_date","current_rank_date","fsd_joining_date","tariq_coy_joining_date"].includes(k);return '<label>'+l+'<input name="'+k+'" type="text" '+(isDate?'placeholder="DD-MM-YYYY" inputmode="numeric"':'')+' value="'+esc(isDate?fmtDate(val):val)+'" '+(["force_no","name"].includes(k)?"required":"")+'></label>'}
function employeeForm(e=null){layout(title(e?"Edit Employee":"Add New Employee","Personal and service information",'<button class="btn" id="back">Cancel</button>')+'<div class="panel"><form id="ef"><div class="formgrid">'+fields.map(f=>field(f[0],f[1],e?e[f[0]]:"")).join("")+'</div><div class="panelhead"><button class="btn primary">Save Employee</button></div></form></div>');$("#back").onclick=()=>{page="Employees";render()};$("#ef").onsubmit=async ev=>{ev.preventDefault();let b=Object.fromEntries(new FormData(ev.currentTarget).entries());for(let k of ["date_of_birth","joining_date","current_rank_date","fsd_joining_date","tariq_coy_joining_date"]){if(!b[k])b[k]=null;else{const parsed=parseDateInput(b[k]);if(!parsed){alert(k.replaceAll("_"," ")+" must be DD-MM-YYYY.");return}b[k]=parsed}}try{if(e)await api("/employees/"+e.id,{method:"PATCH",body:JSON.stringify(b)});else await post("/employees",b);await load();page="Employees";render()}catch(x){alert(x.message)}}}
async function openEmployee(id){let d=await api("/employees/"+id),e=d.employee,ls=d.leaveRecords||[];layout(title(esc(e.name),esc(e.rank+" · "+e.force_no),'<button id="edit" class="btn">Edit</button> <button id="back" class="btn">Back</button>')+'<div class="panel"><div class="formgrid">'+fields.map(f=>'<label>'+f[1]+'<input disabled value="'+esc(["date_of_birth","joining_date","current_rank_date","fsd_joining_date","tariq_coy_joining_date"].includes(f[0])?fmtDate(e[f[0]]):e[f[0]]||"")+'"></label>').join("")+'</div></div><div class="panel"><div class="panelhead"><h2>C/Leave · E/Leave · Medical</h2><button id="addleave" class="btn primary">+ Add record</button></div><div class="tablewrap"><table><tr><th>Sr. No.</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Balance</th></tr>'+ls.map((l,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(l.leave_type)+'</td><td>'+esc(fmtDate(l.from_date))+'</td><td>'+esc(fmtDate(l.to_date))+'</td><td>'+l.days+'</td><td>'+esc(l.balance||"")+'</td></tr>').join("")+'</table></div></div>');$("#back").onclick=()=>{page="Employees";render()};$("#edit").onclick=()=>employeeForm(e);$("#addleave").onclick=()=>leaveForm(e.id)}
function leaveForm(id){layout(title("Add Leave / Medical Record","C/Leave, E/Leave or Medical",'<button id="back" class="btn">Cancel</button>')+'<div class="panel"><form id="lf"><div class="formgrid"><label>Type<select name="leave_type"><option value="C_LEAVE">C/Leave</option><option value="E_LEAVE">E/Leave</option><option value="MEDICAL">Medical</option></select></label><label>From<input type="text" name="from_date" placeholder="DD-MM-YYYY" inputmode="numeric" required></label><label>To<input type="text" name="to_date" placeholder="DD-MM-YYYY" inputmode="numeric" required></label><label>Days<input type="number" min="0" name="days" required></label><label>Balance<input name="balance"></label><label>Remarks<input name="reason"></label></div><div class="panelhead"><button class="btn primary">Save record</button></div></form></div>');$("#back").onclick=()=>openEmployee(id);$("#lf").onsubmit=async ev=>{ev.preventDefault();let b=Object.fromEntries(new FormData(ev.currentTarget).entries());for(let k of ["from_date","to_date"]){const parsed=parseDateInput(b[k]);if(!parsed){alert(k==="from_date"?"From date must be DD-MM-YYYY.":"To date must be DD-MM-YYYY.");return}b[k]=parsed}b.days=Number(b.days);try{await post("/employees/"+id+"/leaves",b);await openEmployee(id)}catch(e){alert(e.message)}}}
async function collection(){
 let d=await api("/collections?month="+month),rows=d.collections||[];
 const byId=new Map(rows.map(r=>[r.employee_id,r]));
 const sorted=rankSorted(employees);
 const paid=sorted.filter(e=>byId.get(e.id)?.payment_status==="PAID").length;
 const received=sorted.reduce((sum,e)=>{const r=byId.get(e.id);return sum+(r&&r.payment_status==="PAID"?Number(r.total_due||0):0)},0);
 layout(title("Monthly Collection","Select an employee name to view the amount and receive payment",'<input id="month" class="field" type="month" value="'+month+'">')+
 '<div class="cards"><div class="card"><label>Total Employees</label><strong>'+sorted.length+'</strong></div><div class="card"><label>Paid</label><strong>'+paid+'</strong></div><div class="card"><label>Unpaid</label><strong>'+(sorted.length-paid)+'</strong></div><div class="card"><label>Total Received Amount</label><strong>Rs '+money(received)+'</strong></div></div>'+
 '<div class="panel"><div class="tablewrap"><table class="collection-table"><thead><tr><th>Sr. No.</th><th>Force Number</th><th>Name</th><th>Received Amount</th><th>Status</th></tr></thead><tbody>'+
 sorted.map((e,i)=>{let r=byId.get(e.id),isPaid=r&&r.payment_status==="PAID",receivedAmount=isPaid?Number(r.total_due||0):0;return '<tr><td>'+(i+1)+'</td><td>'+esc(e.force_no)+'</td><td><button class="name-link" data-collect="'+e.id+'">'+esc(e.name)+'</button></td><td>Rs '+money(receivedAmount)+'</td><td><span class="pill '+(isPaid?'':'status-unpaid')+'">'+(isPaid?'Paid':'Unpaid')+'</span></td></tr>'}).join("")+
 '</tbody></table></div></div>');
 $("#month").onchange=e=>{month=e.target.value;render()};
 document.querySelectorAll("[data-collect]").forEach(b=>b.onclick=()=>openCollectionPopup(b.dataset.collect));
}
async function openCollectionPopup(employeeId){
 const employee=employees.find(e=>e.id===employeeId);if(!employee)return;
 let d=await api("/collections?month="+month),record=(d.collections||[]).find(r=>r.employee_id===employeeId)||null,initialError="";
 if(!record&&["IN","OUT"].includes(employee.living_status)){try{await post("/collections",{employee_id:employeeId,month_key:month,leave_days:0});d=await api("/collections?month="+month);record=(d.collections||[]).find(r=>r.employee_id===employeeId)||null}catch(e){initialError=e.message}}
 const host=document.createElement("div");host.id="collection-modal";host.className="modalback";
 function draw(){
  const r=record||{},isPaid=r.payment_status==="PAID";
  host.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h2>'+esc(employee.name)+'</h2><div class="muted">'+esc(employee.force_no)+' · '+esc(employee.rank)+' · '+esc(month)+'</div>'+
  (!["IN","OUT"].includes(employee.living_status)?'<p class="muted">Pehle Employee record mein Living Status (IN/OUT) set karein.</p>':'')+
  '<div class="fieldrow"><label>Number of Leaves<input id="pop-leaves" type="number" min="0" max="'+daysInSelectedMonth()+'" value="'+(r.leave_days||0)+'" '+(isPaid?'disabled':'')+'></label><label>Leave Deduction (Rs)<input id="pop-manual" type="number" min="0" max="7000" step="1" placeholder="Auto calculate" value="'+(r.leave_deduction_mode==="manual"?r.leave_deduction:"")+'" '+(isPaid?'disabled':'')+'></label></div>'+
  '<div class="amountline"><span>Monthly Contribution</span><b>Rs '+money(r.contribution_total)+'</b></div>'+
  '<div class="amountline"><span>Leave Deduction</span><b>Rs '+money(r.leave_deduction)+'</b></div>'+
  '<div class="amountline"><span>Mess / Ration</span><b>Rs '+money(r.mess_amount)+'</b></div>'+
  '<div class="amountline total"><span>Total Amount</span><span>Rs '+money(r.total_due)+'</span></div>'+
  '<p class="muted" id="pop-note">'+(r?"Amount saved for this month.":esc(initialError||"Enter leave days and select Calculate Amount."))+'</p><div class="modalactions"><button id="pop-close" class="btn">Close</button>'+
  (!isPaid?'<button id="pop-calc" class="btn">'+(r?'Update Amount':'Calculate Amount')+'</button>':'')+
  (r&&!isPaid?'<button id="pop-receive" class="btn primary">Receive</button>':(isPaid?'<span class="pill">Paid</span>':''))+'</div></div>';
  $("#pop-close").onclick=()=>host.remove();
  const calc=$("#pop-calc");if(calc)calc.onclick=async()=>{
   const leaves=Number($("#pop-leaves").value||0),manual=$("#pop-manual").value;
   const body={employee_id:employeeId,month_key:month,leave_days:leaves};
   if(manual!=="")body.manual_leave_deduction=Number(manual);
   calc.disabled=true;calc.textContent="Saving…";
   try{await post("/collections",body);const latest=await api("/collections?month="+month);record=(latest.collections||[]).find(x=>x.employee_id===employeeId)||null;draw()}
   catch(e){const note=$("#pop-note");if(note)note.textContent=e.message;calc.disabled=false;calc.textContent=r?'Update Amount':'Calculate Amount'}
  };
  const receive=$("#pop-receive");if(receive)receive.onclick=async()=>{
   if(!confirm('Receive full amount Rs '+money(r.total_due)+' from '+employee.name+'?'))return;
   receive.disabled=true;
   try{await post("/collections/"+r.id+"/receive",{payment_date:new Date().toISOString().slice(0,10),payment_method:"Cash"});host.remove();await collection()}
   catch(e){const note=$("#pop-note");if(note)note.textContent=e.message;receive.disabled=false}
  };
 }
 document.body.appendChild(host);draw();
}
function daysInSelectedMonth(){const [y,m]=month.split("-").map(Number);return new Date(y,m,0).getDate()}
async function history(){let d=await api("/history?limit=500"),rows=(d.collections||[]).filter(r=>r.month_key===month);layout(title("Collection History","Monthly saved records",'<input id="month" class="field" type="month" value="'+month+'">')+'<div class="panel"><div class="tablewrap"><table><tr><th>Sr.</th><th>Month</th><th>Force No.</th><th>Rank / Name</th><th>Contribution</th><th>Mess</th><th>Total</th><th>Status</th></tr>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.month_key+'</td><td>'+esc(r.force_no)+'</td><td>'+esc(r.rank+" "+r.name)+'</td><td>'+money(r.contribution_total)+'</td><td>'+money(r.mess_amount)+'</td><td>'+money(r.total_due)+'</td><td>'+pill(r.payment_status)+'</td></tr>').join("")+'</table></div></div>');$("#month").onchange=e=>{month=e.target.value;render()}}
function reports(){let ts=[["nominal-role","Nominal Roll"],["driving-license","Driving License"],["monthly-contribution","Monthly Contribution"],["mess","Ration Money / Mess"],["full-collection","Full Collection"],["leave-medical","C/Leave + E/Leave + Medical"]];layout(title("Reports","Select a report, then export CSV or save a print-ready PDF",'<input id="month" class="field noprint" type="month" value="'+month+'">')+'<div class="cards noprint">'+ts.map(t=>'<button class="card" data-report="'+t[0]+'"><label>REPORT</label><strong style="font-size:16px">'+t[1]+'</strong></button>').join("")+'</div><div id="result"></div>');$("#month").onchange=e=>{month=e.target.value};document.querySelectorAll("[data-report]").forEach(b=>b.onclick=async()=>{try{let reportId=b.dataset.report,d=await api("/reports/"+reportId+(['monthly-contribution','mess','full-collection'].includes(reportId)?"?month="+month:"")),rs=d.rows||[];
 let cols={
  "nominal-role":["sr_no","force_no","rank","name","remarks"],
  "driving-license":["sr_no","force_no","rank","name","driving_license"],
  "monthly-contribution":["sr_no","force_no","rank","name","welfare","mod_amount","med","barber","waiter","wman","contribution_total"],
  "mess":["sr_no","force_no","rank","name","leave_days","leave_deduction","mess_amount"],
  "full-collection":["sr_no","force_no","rank","name","contribution_total","mess_amount","total_due","payment_status"],
  "leave-medical":["sr_no","force_no","rank","name","c_leave","e_leave","medical","remarks"]
 },titles={"nominal-role":"Nominal Roll","driving-license":"Driving License Report","monthly-contribution":"Monthly Contribution Report","mess":"Ration Money / Mess Report","full-collection":"Full Collection Report","leave-medical":"Leave & Medical Report"},labels={sr_no:"Sr. No.",force_no:"Force Number",rank:"Rank",name:"Name",welfare:"Welfare",mod_amount:"MOD",med:"MED",barber:"Barber",waiter:"Waiter",wman:"W.Man",contribution_total:"Total Contribution",mess_amount:"Mess Amount",leave_days:"Leave Days",leave_deduction:"Leave Deduction",total_due:"Total Due",payment_status:"Payment Status",driving_license:"Driving License",remarks:"Remarks",c_leave:"C/Leave",e_leave:"E/Leave",medical:"Medical"};
 const cs=cols[reportId]||[],reportTitle=titles[reportId]||"Report",dateText=formatNowDate(),period=["monthly-contribution","mess","full-collection"].includes(reportId)?"Reporting Month: "+month:"Generated: "+dateText;
 const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
 $("#result").innerHTML='<div class="panel report-sheet"><div class="panelhead noprint"><div><h2>'+esc(reportTitle)+'</h2><div class="muted">'+rs.length+' records · '+esc(period)+'</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="csv" class="btn">Download CSV</button><button id="pdf" class="btn primary">Download PDF / Print</button></div></div><div class="report-heading"><h1>TARIQ COY</h1><h2>'+esc(reportTitle)+'</h2><div class="report-subtitle">'+esc(period)+'</div><div class="report-meta">Generated on: '+esc(dateText)+' · Total records: '+rs.length+'</div></div><div class="tablewrap"><table class="report-table"><thead><tr>'+cs.map(k=>'<th>'+esc(labels[k]||k)+'</th>').join("")+'</tr></thead><tbody>'+(rs.length?rs.map((r,i)=>'<tr>'+cs.map(k=>'<td>'+esc(reportValue(k,r[k],i))+'</td>').join("")+'</tr>').join(""):'<tr><td colspan="'+cs.length+'" style="text-align:center;padding:24px">No records found for this report.</td></tr>')+'</tbody></table></div><div class="report-foot">Tariq Coy · '+esc(reportTitle)+' · '+esc(period)+'</div></div>';
 $("#csv").onclick=()=>{let s=[cs.map(k=>q(labels[k]||k)).join(","),...rs.map((r,i)=>cs.map(k=>q(k==="sr_no"?(r[k]??i+1):(r[k]??""))).join(","))].join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv;charset=utf-8"}));a.download=reportId+"-"+month+".csv";a.click();URL.revokeObjectURL(a.href)};
 $("#pdf").onclick=()=>window.print();
 }catch(e){alert(e.message)}})}async function rates(){let d=await api("/rates?month="+month),rs=d.rates||[];layout(title("Contribution Rates","Rank and living status rates",'<input id="month" class="field" type="month" value="'+month+'"> <button id="newrate" class="btn primary">+ Add rate</button>')+'<div class="panel"><div class="tablewrap"><table><tr><th>Rank</th><th>Living</th><th>Welfare</th><th>MOD</th><th>MED</th><th>Barber</th><th>Waiter</th><th>W.Man</th><th>Total</th></tr>'+ratesRankSorted(rs).map(r=>{let total=["welfare","mod_amount","med","barber","waiter","wman"].reduce((s,k)=>s+Number(r[k]||0),0);return '<tr>'+["rank","living_status","welfare","mod_amount","med","barber","waiter","wman"].map(k=>'<td>'+esc(r[k])+'</td>').join("")+'<td><b>Rs '+money(total)+'</b></td></tr>'}).join("")+'</table></div></div>');$("#month").onchange=e=>{month=e.target.value;render()};$("#newrate").onclick=rateForm}
function rateForm(){layout(title("Add Contribution Rate","Rate effective month",'<button id="back" class="btn">Cancel</button>')+'<div class="panel"><form id="rf"><div class="formgrid"><label>Rank<select name="rank">'+["DD","AD","INSP","SI","ASI","SGT","CPL"].map(x=>'<option>'+x+'</option>').join("")+'</select></label><label>Living<select name="living_status"><option>IN</option><option>OUT</option></select></label><label>Effective month<input name="effective_from" type="month" value="'+month+'" required></label>'+["welfare","mod_amount","med","barber","waiter","wman"].map(k=>'<label>'+k+'<input name="'+k+'" type="number" min="0" step=".01" value="0" required></label>').join("")+'</div><div class="panelhead"><button class="btn primary">Save Rate</button></div></form></div>');$("#back").onclick=()=>{page="Contribution Rates";render()};$("#rf").onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.currentTarget).entries());for(let k of ["welfare","mod_amount","med","barber","waiter","wman"])b[k]=Number(b[k]);try{await post("/rates",b);render()}catch(x){alert(x.message)}}}
function settings(){layout(title("Settings","Application and account information")+'<div class="cards"><div class="card"><label>Account</label><strong style="font-size:18px">'+esc(user.username)+'</strong></div><div class="card"><label>Role</label><strong style="font-size:18px">'+esc(user.role)+'</strong></div><div class="card"><label>Session</label><strong style="font-size:18px">Secure</strong></div><div class="card"><label>Storage</label><strong style="font-size:18px">Cloudflare D1</strong></div></div>')}
async function load(){employees=(await api("/employees")).employees||[]}async function render(){try{if(page==="Home"){layout(home());$("#add").onclick=()=>employeeForm();wireEmployeeActions()}else if(page==="Employees"){layout(title("Employees","Personnel master register",'<button id="add" class="btn primary">+ Add employee</button>')+list());$("#add").onclick=()=>employeeForm();wireEmployeeActions()}else if(page==="Collection")await collection();else if(page==="History")await history();else if(page==="Reports")reports();else if(page==="Contribution Rates")await rates();else settings()}catch(e){layout(title(page,"Unable to load section")+'<p>'+esc(e.message)+'</p>')}}
function wireEmployeeActions(){document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openEmployee(b.dataset.open));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this employee from the active register? Existing collection and leave history will be retained."))return;try{await api("/employees/"+b.dataset.delete,{method:"DELETE"});await load();render()}catch(e){alert(e.message)}})}
async function login(){
 let status=null,statusError="";
 try{status=await api("/setup-status")}catch(e){statusError=e.message||"Unable to check first-time setup."}
 const showSetup=async()=>{
  let secretRequired=Boolean(status&&status.setupSecretRequired);
  $("#app").innerHTML='<div class="login"><form id="setup"><h1>Tariq Coy</h1><p class="muted">First-time administrator setup</p><p>Create the first administrator account. Setup automatically closes after the first account is created.</p>'+(statusError?'<p class="error">'+esc(statusError)+'</p>':'')+'<label>Admin username<input name="username" required minlength="3" maxlength="50" autocomplete="username"></label><label>Password (minimum 12 characters)<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label>'+(secretRequired?'<label>Bootstrap secret<input name="secret" type="password" required autocomplete="off"></label>':'')+'<button class="btn primary">Create admin account</button><p id="err" class="error"></p><button type="button" id="backlogin" class="btn">Back to sign in</button></form></div>';
  $("#backlogin").onclick=()=>login(true);
  $("#setup").onsubmit=async e=>{
   e.preventDefault();const form=e.currentTarget,f=new FormData(form),headers={"Content-Type":"application/json"};
   if(form.elements.secret)headers["x-bootstrap-secret"]=f.get("secret");
   try{const r=await fetch("/api/setup-admin",{method:"POST",headers,body:JSON.stringify({username:f.get("username"),password:f.get("password")})});const d=await r.json();if(!r.ok)throw Error(d.error||"Setup failed");alert("First administrator account created. Please sign in.");login(true)}catch(x){$("#err").textContent=x.message}
  };
 };
 if(!status||status.setupRequired){await showSetup();return;}
 $("#app").innerHTML='<div class="login"><form id="login"><h1>Tariq Coy</h1><p class="muted">Personnel Record Management System</p><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary">Sign in</button><p id="err" class="error"></p><button type="button" id="firstsetup" class="btn">First-time account setup</button></form></div>';
 $("#firstsetup").onclick=async()=>{statusError="";await showSetup()};
 $("#login").onsubmit=async e=>{e.preventDefault();try{user=(await post("/login",Object.fromEntries(new FormData(e.currentTarget).entries()))).user;await load();page="Home";render()}catch(x){$("#err").textContent=x.message}}
}
async function logout(){try{await api("/logout",{method:"POST"})}finally{user=null;login()}}async function start(){try{user=(await api("/me")).user;await load();render()}catch{login()}}start();
</script></body></html>
