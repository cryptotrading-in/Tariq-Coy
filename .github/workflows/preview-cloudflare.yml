name: Deploy PR Preview (Existing TariqCoy Database)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [fix/nominal-roll-pdf-layout]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install

      - name: Resolve pull request number
        id: resolve-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')"
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then echo "Could not resolve PR number for preview"; exit 1; fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build preview Worker config using existing database
        env:
          PR_NUMBER: ${{ steps.resolve-pr.outputs.number }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let c = fs.readFileSync('wrangler.toml', 'utf8');
          c = c.replace(/^name = .*$/m, 'name = "tariq-coy-preview-pr-' + process.env.PR_NUMBER + '"');
          fs.writeFileSync('wrangler.preview.toml', c);
          NODE

      - name: Deploy preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.preview.toml 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          if [ -z "$URL" ]; then URL="https://tariq-coy-preview-pr-${{ steps.resolve-pr.outputs.number }}.earnybycrypto.workers.dev"; fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const prNumber = Number('${{ steps.resolve-pr.outputs.number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: 'Preview URL (uses existing tariqcoydb and existing login/admin records): ' + url + '\n\nImportant: this preview shares the live database. Do not test create/edit/delete/payment actions here. PR #17 is not merged.'
            });
