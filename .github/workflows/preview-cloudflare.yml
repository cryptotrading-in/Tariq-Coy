name: Isolated UI Preview
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Create isolated preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          DB_NAME="tariqcoy-preview-pr-$PR_NUMBER"
          LIST="$(npx wrangler d1 list)"
          DB_ID="$(printf '%s\n' "$LIST" | grep -F "$DB_NAME" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)"
          if [ -z "$DB_ID" ]; then
            CREATE_OUTPUT="$(npx wrangler d1 create "$DB_NAME")"
            printf '%s\n' "$CREATE_OUTPUT"
            DB_ID="$(printf '%s\n' "$CREATE_OUTPUT" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)"
          fi
          if [ -z "$DB_ID" ]; then echo "Could not resolve preview D1 database ID"; exit 1; fi
          echo "PREVIEW_DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "PREVIEW_DB_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Build isolated config
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p preview-migrations
          cp migrations/0001_schema.sql preview-migrations/
          cp migrations/0001_initial_schema.sql preview-migrations/
          cp migrations/0002_align_worker_schema.sql preview-migrations/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let c=fs.readFileSync('wrangler.toml','utf8');
          c=c.replace(/^name = .*$/m,'name = "tariq-coy-preview-pr-'+process.env.PR_NUMBER+'"');
          c=c.replace(/^database_name = .*$/m,'database_name = "'+process.env.PREVIEW_DB_NAME+'"');
          c=c.replace(/^database_id = .*$/m,'database_id = "'+process.env.PREVIEW_DB_ID+'"');
          c=c.replace(/^APP_ENV = .*$/m,'APP_ENV = "preview"');
          c=c.replace(/^\[\[d1_databases\]\]$/m,'[[d1_databases]]\nmigrations_dir = "preview-migrations"');
          if(!/^workers_dev\s*=/m.test(c)) c=c.replace(/^main = .*$/m,'$&\nworkers_dev = true');
          fs.writeFileSync('wrangler.preview.toml',c);
          NODE
      - name: Migrate isolated preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply "$PREVIEW_DB_NAME" --remote --config wrangler.preview.toml
      - name: Deploy preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.preview.toml 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          test -n "$URL"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Publish preview link
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'UI preview URL: ' + url + '\n\nThis is an isolated Worker with a separate empty D1 database; it does not use production records. Create a preview-only admin account on first visit. Production is unchanged.'
            });
